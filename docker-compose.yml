# docs/TECH_STACK.md "Deployment: Docker + Docker Compose" — backend + frontend + redis (session store).
# CLAUDE.md §3.5 (revised): Redis was added deliberately for session restart-safety and multi-process
# readiness — still no separate database container; the FAISS index remains a per-session on-disk file, not
# something Redis stores.
# `.env` is read at compose-up time, never baked into either image.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - textinsight
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      # Host port 8080, not 8000: 8000 is a common default that other local services/containers on a
      # developer's machine may already be using (hit exactly this collision during development). The
      # container's own internal port stays 8000 — only how it's reached from outside Docker changes.
      # Internal container-to-container calls (the frontend's BACKEND_URL below) always use the
      # container's real port, never the host-side mapping.
      - "8080:8000"
    env_file:
      - .env
    environment:
      # Overrides .env's localhost default — inside Compose's network the backend reaches Redis by
      # service name, not localhost.
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # Named volume for the HF model cache so weights aren't re-downloaded on every container rebuild
      # (docs/TECH_STACK.md).
      - hf-cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - textinsight

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - textinsight

volumes:
  hf-cache:
  redis-data:

networks:
  textinsight:
    driver: bridge
